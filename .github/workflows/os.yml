name: OS

on:
  push:
    branches: ["*"]
  pull_request:
  workflow_dispatch:

jobs:

  macos:
    runs-on: macos-15
    name: MacOS
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt 6
      run: brew install qt@6

    - name: Configure build
      run: |
        cmake --preset debug

    - name: Execute build
      run: |
        cmake --build --preset debug

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: vm-macos
        path: |
          build/debug/vm

  windows:
    runs-on: windows-2022
    name: Windows
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Qt 6
      uses: jurplel/install-qt-action@v4
      with:
        version: "6.9.0"

    - name: Configure build
      run: |
        cmake -DCMAKE_PREFIX_PATH="C:\a\hello\Qt\6.9.0\msvc2022_64\" -DCI= --preset debug-windows

    - name: Execute build
      run: |
        cmake --build --preset debug-windows

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: vm-windows
        path: |
          build\debug-windows\Debug\vm.exe

  linux:
    runs-on: ubuntu-22.04
    name: Linux
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Build project using docker
      run: |
        docker buildx build . -f dist/linux.Dockerfile --progress=plain --output out

    - name: Upload binary
      uses: actions/upload-artifact@v4
      with:
        if-no-files-found: error
        name: vm-linux
        path: |
          out/vm
