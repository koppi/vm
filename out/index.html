<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VM Qt WebAssembly Application</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            overflow: hidden;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        #loading {
            text-align: center;
            font-size: 18px;
            color: #333;
            z-index: 1000;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        #canvas {
            border: 1px solid #ccc;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
        
        #error {
            color: #d32f2f;
            background-color: #ffebee;
            border: 1px solid #f8bbd9;
            border-radius: 4px;
            padding: 16px;
            margin: 20px;
            max-width: 600px;
            text-align: center;
            display: none;
            z-index: 1000;
        }
        
        #qt-container {
            position: relative;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="loading">
            <div class="spinner"></div>
            <p>Loading Qt WebAssembly Application...</p>
            <p id="status">Initializing...</p>
        </div>
        
        <div id="error">
            <h3>Failed to load application</h3>
            <p id="error-message"></p>
        </div>
        
        <div id="qt-container">
            <canvas id="canvas" width="800" height="600"></canvas>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const loading = document.getElementById('loading');
        const status = document.getElementById('status');
        const error = document.getElementById('error');
        const errorMessage = document.getElementById('error-message');
        const qtContainer = document.getElementById('qt-container');

        // Configure Module before loading vm.js
        var Module = {
            preRun: [
                function() {
                    // Set up canvas for Qt
                    Module.qtContainerElements = [qtContainer];
                    ENV['QT_QPA_PLATFORM'] = 'wasm';
                    ENV['QT_WEBGL_PLATFORM'] = '1';
                }
            ],
            postRun: [
                function() {
                    Module.setStatus('Application started!');
                    setTimeout(() => {
                        loading.style.display = 'none';
                        canvas.style.display = 'block';
                        resizeCanvas();
                    }, 1000);
                }
            ],
            print: function(text) {
                console.log('[Qt WASM]', text);
            },
            printErr: function(text) {
                console.error('[Qt WASM Error]', text);
                if (text.includes('Cannot create window: no screens available')) {
                    loading.style.display = 'none';
                    error.style.display = 'block';
                    errorMessage.textContent = 'Qt initialization failed: No screens available. Make sure canvas is properly configured.';
                }
            },
            canvas: canvas,
            qtCanvas: canvas,
            locateFile: function(filename) {
                console.log('Loading:', filename);
                return filename;
            },
            setStatus: function(text) {
                if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
                if (text === Module.setStatus.last.text) return;
                const m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
                let now = Date.now();
                if (m && now - Module.setStatus.last.time < 30) return;
                Module.setStatus.last.time = now;
                Module.setStatus.last.text = text;
                if (m) {
                    text = m[1];
                    status.innerHTML = `${text} (${m[2]}/${m[4]})`;
                } else {
                    status.innerHTML = text;
                }
            },
            totalDependencies: 0,
            monitorRunDependencies: function(left) {
                this.totalDependencies = Math.max(this.totalDependencies, left);
                Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
            }
        };

        Module.setStatus('Downloading...');

        // Error handling
        window.addEventListener('error', function(event) {
            if (event.filename && event.filename.includes('vm.js')) {
                loading.style.display = 'none';
                error.style.display = 'block';
                errorMessage.textContent = 'Failed to load WebAssembly module: ' + (event.message || 'Unknown error');
                console.error('WebAssembly error:', event);
            }
        });

        window.addEventListener('unhandledrejection', function(event) {
            loading.style.display = 'none';
            error.style.display = 'block';
            errorMessage.textContent = 'WebAssembly promise rejected: ' + (event.reason || 'Unknown error');
            console.error('Unhandled promise rejection:', event);
        });

        // Canvas resize function
        function resizeCanvas() {
            if (!canvas.width || !canvas.height) return;
            
            const maxWidth = window.innerWidth - 40;
            const maxHeight = window.innerHeight - 40;
            const aspectRatio = canvas.width / canvas.height;
            
            let width = Math.min(800, maxWidth);
            let height = width / aspectRatio;
            
            if (height > maxHeight) {
                height = maxHeight;
                width = height * aspectRatio;
            }
            
            canvas.style.width = width + 'px';
            canvas.style.height = height + 'px';
        }

        window.addEventListener('resize', resizeCanvas);

        // Fallback error handler
        setTimeout(() => {
            if (loading.style.display !== 'none') {
                loading.style.display = 'none';
                error.style.display = 'block';
                errorMessage.textContent = 'Application failed to load. Please check browser console for details.';
            }
        }, 15000);
    </script>

    <!-- Load Emscripten-generated JavaScript -->
    <script src="vm.js"></script>
</body>
</html>
